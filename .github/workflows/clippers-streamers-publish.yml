          if ! echo "$MODEL_SHA1  $W/ggml-base.bin" | sha1sum -c --quiet -; then rm -f "$W/ggml-base.bin"; echo "::warning::whisper model SHA-1 mismatch"; exit 1; fi
          if [ -n "$MODEL_SHA256" ] && ! echo "$MODEL_SHA256  $W/ggml-base.bin" | sha256sum -c --quiet -; then rm -f "$W/ggml-base.bin"; echo "::warning::whisper model SHA-256 mismatch"; exit 1; fi
          echo "whisper model sha256: $(sha256sum "$W/ggml-base.bin" | cut -d' ' -f1) (cache hit: ${CACHE_HIT:-false})"
          "$W/whisper-cli" --help > /dev/null 2>&1
          { echo "CLIPPERS_WHISPER_BIN=$W/whisper-cli"; echo "CLIPPERS_WHISPER_MODEL=$W/ggml-base.bin"; echo "CLIPPERS_WHISPER_THREADS=$(nproc)"; } >> "$GITHUB_ENV"

      - name: Download, render, publish approved clips
        if: steps.gate.outputs.run == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED: ${{ vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED }}
          CLIPPERS_STREAMER_CLOUD_KILL_SWITCH: ${{ vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH || 'false' }}
          CLIPPERS_STREAMER_CLOUD_DRY_RUN: 'true'
          CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN: ${{ vars.CLIPPERS_STREAMER_CLOUD_CLIPS_PER_RUN }}
          CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION: ${{ vars.CLIPPERS_STREAMER_CLOUD_DAILY_PER_DESTINATION }}
          CLIPPERS_STREAMER_CLOUD_SLOTS: ${{ vars.CLIPPERS_STREAMER_CLOUD_SLOTS }}
          CLIPPERS_STREAMER_CLOUD_DESTINATIONS: ${{ vars.CLIPPERS_STREAMER_CLOUD_DESTINATIONS }}
          CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_MIN_INTERVAL_MINUTES || '180' }}
          CLIPPERS_STREAMER_CLIP_SECONDS: ${{ vars.CLIPPERS_STREAMER_CLIP_SECONDS }}
          CLIPPERS_STREAMER_CLOUD_PLATFORMS: ${{ vars.CLIPPERS_STREAMER_CLOUD_PLATFORMS }}
          # Optional residential proxy for YouTube sources only (docs/clippers-cloud-lanes.md section 5). Unset = Twitch-only default.
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
          CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES: ${{ vars.CLIPPERS_STREAMER_CLOUD_RUN_DEADLINE_MINUTES || '20' }}
          CLIPPERS_STREAMER_LANES_ENABLED: ${{ vars.CLIPPERS_STREAMER_LANES_ENABLED || 'true' }}
          CLIPPERS_STREAMER_LANE_AUTOPUBLISH: ${{ vars.CLIPPERS_STREAMER_LANE_AUTOPUBLISH || 'true' }}
          # Owner override (kill switch: set the repo variable to "off" / "" -> drafts + owner approval again).
          CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE: ${{ vars.CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE || 'default' }}
          CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS: ${{ vars.CLIPPERS_STREAMER_GROWTH_INTERVAL_HOURS || '6' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node --import tsx script/clippers-streamer-cloud-worker.mjs --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          else
            node --import tsx script/clippers-streamer-cloud-worker.mjs --respect-interval --dry-run-output "$RUNNER_TEMP/clippers-dry-run"
          fi

      - name: Keep dry-run renders for review (1 day)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clippers-dry-run-renders
          path: ${{ runner.temp }}/clippers-dry-run/*.mp4
          retention-days: 1
          if-no-files-found: ignore

  # Per-account growth loop in the cloud (no Mac): once a day before the first slot (New York 08:00-08:14),
  # or on a growth_only dispatch. Read-only Metricool analytics + best time; never writes a Metricool post.
  # Decisions (kill < 300 median after 6 posts, > 10k -> 3 follow-ups, > 100k -> double the creator,
  # auto-publish at weekly median >= 1k) are stored in the streamer ledger for the publish job and the office.
  growth:
    if: >-
      github.repository == 'robertmanzanillag-jpg/blackops' &&
      vars.CLIPPERS_STREAMERS_CLOUD_ENABLED == 'true' &&
      vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH != 'true' &&
      vars.CLIPPERS_STREAMER_LANES_ENABLED != 'false' &&
      (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.growth_only && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clock gate (New York 08:00-08:14, unless dispatched)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          minute=$((10#$(date -u +%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$hour" -eq 8 ] && [ "$minute" -lt 15 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ vars.OFFICE_SOURCE_REF || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Growth loop (read-only Metricool)
        if: steps.gate.outputs.run == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED: ${{ vars.CLIPPERS_STREAMER_CLOUD_PUBLISH_ENABLED }}
          CLIPPERS_STREAMER_CLOUD_KILL_SWITCH: ${{ vars.CLIPPERS_STREAMER_CLOUD_KILL_SWITCH || 'false' }}
          CLIPPERS_STREAMER_CLOUD_DESTINATIONS: ${{ vars.CLIPPERS_STREAMER_CLOUD_DESTINATIONS }}
          CLIPPERS_STREAMER_LANES_ENABLED: 'true'
          # Owner override (kill switch: set the repo variable to "off" / "" -> drafts + owner approval again).
          CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE: ${{ vars.CLIPPERS_LANES_AUTOPUBLISH_OVERRIDE || 'default' }}
        run: node --import tsx script/clippers-streamer-cloud-worker.mjs --growth-only
