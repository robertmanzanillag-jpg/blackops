name: Post-publish watch

# Hourly, read-only check of what is running in production after a publish. If it detects a
# regression it opens (or updates) ONE GitHub issue labeled `regression` with fixed codes, so the
# problem re-enters the normal process: fix PR -> sandbox release gate -> merge -> Replit sync.
#
# Signals (all read-only; see script/release-gate/post-publish-evaluate.mjs):
#   OFFICE_RUNS_FAILING          >= 3 consecutive failed runs of office-worker-cloud.yml
#   OFFICE_STATUS_UNAVAILABLE    script/office-status.ts could not answer
#   COUNCIL_STATE_MISSING        no council state for the owner
#   ROLE_WORK_INVALID            office roleWork journal fails validation
#   CAPABILITY_TRAINING_INVALID  capability training journal fails validation
#   OFFICE_WORKER_SILENT         no cloud office worker seen for > 1 h (only if the cloud office is on)
#   WEB_EXPORT_MISSING/STALE     web source export missing or older than 1 h (only if web sources are on)
#
# Public repository => public logs and issues: only codes, counts and ages are printed or posted,
# never ids, URLs of private services, connection details or office content. office-status runs in
# a READ ONLY transaction that is always rolled back.
#
# Scheduled workflows only run from the default branch, so this file lives on `main`; it executes
# the reviewed production source named by OFFICE_SOURCE_REF. Pause: set the repository variable
# POST_PUBLISH_WATCH_ENABLED to 'false' (or set it in .github/office-config.env).

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: post-publish-watch
  cancel-in-progress: false

jobs:
  config:
    # Resolves non-secret settings (repository variables win over .github/office-config.env) and
    # reports, as true/false only, whether the database secrets exist. Without them the watch is
    # skipped with a notice (it would otherwise open a false OFFICE_STATUS_UNAVAILABLE issue).
    if: github.repository == 'robertmanzanillag-jpg/blackops' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      env: ${{ steps.cfg.outputs.env }}
      OFFICE_SOURCE_REF: ${{ steps.cfg.outputs.OFFICE_SOURCE_REF }}
      ready_watch: ${{ steps.cfg.outputs.ready_watch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: cfg
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRET_OFFICE_DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL != '' }}
          SECRET_OFFICE_OWNER_ID: ${{ secrets.OFFICE_OWNER_ID != '' }}
          GROUP_watch: POST_PUBLISH_WATCH_ENABLED!=false OFFICE_DATABASE_URL OFFICE_OWNER_ID
        run: node .github/office-config.mjs

  watch:
    # Only from main (schedules always are; a dispatch from another branch would run its copy).
    needs: config
    if: github.repository == 'robertmanzanillag-jpg/blackops' && github.ref == 'refs/heads/main' && needs.config.outputs.ready_watch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Load office configuration (variables override .github/office-config.env)
        env:
          OFFICE_CONFIG_ENV: ${{ needs.config.outputs.env }}
        run: printf '%s\n' "$OFFICE_CONFIG_ENV" >> "$GITHUB_ENV"

      - name: Refuse to run without a reviewed production source
        run: |
          # An empty ref would make actions/checkout fall back to the dispatching branch.
          if [ -z "${OFFICE_SOURCE_REF:-}" ]; then echo "::error::OFFICE_SOURCE_REF is empty"; exit 1; fi

      - name: Check out the reviewed production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.config.outputs.OFFICE_SOURCE_REF }}
          persist-credentials: false

      - name: Verify the reviewed scripts exist
        id: verify
        run: |
          # Until the release-gate PR is merged into the production branch the evaluator is absent:
          # skip quietly instead of failing every hour.
          if test -f script/office-status.ts && test -f script/release-gate/post-publish-evaluate.mjs; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::production source has no script/release-gate yet; post-publish watch skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.verify.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.verify.outputs.ready == 'true'

      - name: Read-only office status
        if: steps.verify.outputs.ready == 'true'
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.OFFICE_DATABASE_URL }}
          DEFAULT_USER_ID: ${{ secrets.OFFICE_OWNER_ID }}
        run: |
          # Never printed: it is evaluated into codes in the next step.
          node --import tsx script/office-status.ts > "$RUNNER_TEMP/office-status.json" 2> /dev/null || echo "office-status unavailable"

      - name: Recent office worker runs
        if: steps.verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows/office-worker-cloud.yml/runs?per_page=10" \
            --jq '{workflow_runs: [.workflow_runs[] | {status, conclusion, created_at}]}' > "$RUNNER_TEMP/runs.json" || echo '{"workflow_runs":[]}' > "$RUNNER_TEMP/runs.json"

      - name: Evaluate
        if: steps.verify.outputs.ready == 'true'
        id: evaluate
        run: |
          set -euo pipefail
          # Resolved by the "Load office configuration" step (variables, else .github/office-config.env).
          export OFFICE_CLOUD_ENABLED="${OFFICE_WORKER_CLOUD_ENABLED:-}" WEB_SOURCES_ENABLED="${OFFICE_WEB_SOURCES_ENABLED:-}"
          node script/release-gate/post-publish-evaluate.mjs --status "$RUNNER_TEMP/office-status.json" --runs "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/verdict.json"
          node -e 'const v=require(process.argv[1]);console.log(v.ok?"no regressions":v.codes.map(c=>`${c.code}: ${c.detail}`).join("\n"))' "$RUNNER_TEMP/verdict.json"
          echo "ok=$(node -p 'require(process.argv[1]).ok' "$RUNNER_TEMP/verdict.json")" >> "$GITHUB_OUTPUT"

      - name: Open or update the regression issue
        if: steps.verify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ steps.evaluate.outputs.ok }}
        run: |
          set -euo pipefail
          title="[post-publish-watch] Regresion en produccion"
          gh label create regression --repo "$REPO" --color B60205 --description "Post-publish regression: re-enter the fix process" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --state open --label regression --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          codes=$(node -p 'require(process.argv[1]).codes.map(c=>c.code).sort().join(",")' "$RUNNER_TEMP/verdict.json")
          body_file="$RUNNER_TEMP/body.md"
          node -e '
            const v = require(process.argv[1]);
            const lines = ["<!-- post-publish-watch codes: " + v.codes.map(c => c.code).sort().join(",") + " -->",
              "La vigilancia post-publicacion detecto una regresion en produccion.", "",
              "| Codigo | Detalle |", "| --- | --- |", ...v.codes.map(c => `| \`${c.code}\` | ${c.detail} |`), "",
              "**Que hacer (proceso completo, docs/release-gate.md):**",
              "1. Abrir un PR de arreglo hacia `main` (nunca directo).",
              "2. Esperar el check `release-gate` en verde (sandbox + gate exigente) y la revision independiente.",
              "3. Merge, `script/replit-sync-from-github.sh`, republicar en Replit con aprobacion de Robert.",
              "4. Esta vigilancia vuelve a comprobar cada hora.", "",
              `Ultima deteccion: ${new Date().toISOString()} - ${process.env.RUN_URL}`];
            require("fs").writeFileSync(process.argv[2], lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/verdict.json" "$body_file"
          if [ "$OK" = "true" ]; then
            if [ -n "$number" ]; then
              previous=$(gh issue view "$number" --repo "$REPO" --json body --jq .body | sed -n 's/.*post-publish-watch codes: \([A-Z_,]*\).*/\1/p' | head -1)
              if [ "$previous" != "RECOVERED" ]; then
                gh issue comment "$number" --repo "$REPO" --body "Sin regresiones en la comprobacion de $(date -u +%FT%TZ) ($RUN_URL). Cerrar este issue cuando el PR de arreglo este mergeado y publicado."
                gh issue edit "$number" --repo "$REPO" --body "$(gh issue view "$number" --repo "$REPO" --json body --jq .body | sed 's/post-publish-watch codes: [A-Z_,]*/post-publish-watch codes: RECOVERED/')"
              fi
            fi
            echo "no regressions"; exit 0
          fi
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" --label regression --body-file "$body_file"
          else
            previous=$(gh issue view "$number" --repo "$REPO" --json body --jq .body | sed -n 's/.*post-publish-watch codes: \([A-Z_,]*\).*/\1/p' | head -1)
            gh issue edit "$number" --repo "$REPO" --body-file "$body_file"
            if [ "$previous" != "$codes" ]; then
              gh issue comment "$number" --repo "$REPO" --body "Codigos actualizados: \`${codes}\` (antes: \`${previous:-ninguno}\`). $RUN_URL"
            fi
          fi
          echo "::warning::post-publish regression: $codes"
