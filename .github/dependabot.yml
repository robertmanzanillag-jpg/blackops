# Weekly, low-volume dependency updates. Every Dependabot PR still goes through the release gate
# (sandbox-gate.yml); package.json/package-lock.json changes need the owner's `gate-justified` label.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies]
